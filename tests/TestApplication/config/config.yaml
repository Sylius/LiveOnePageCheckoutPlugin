imports:
    - { resource: "@SyliusLiveOnePageCheckoutPlugin/config/config.yaml" }
    - { resource: "services_test.php" }

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

sylius_channel:
    resources:
        channel:
            classes:
                model: Tests\Sylius\LiveOnePageCheckoutPlugin\Entity\Channel

sylius_order:
    resources:
        order:
            classes:
                model: Tests\Sylius\LiveOnePageCheckoutPlugin\Entity\Order


doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\Sylius\LiveOnePageCheckoutPlugin
