Sylius\Bundle\PayumBundle\Model\GatewayConfig:
    gateway_offline:
        gatewayName: 'Offline'
        factoryName: 'offline'
        config: []
    gateway_stripe:
        gatewayName: 'Stripe'
        factoryName: 'stripe_checkout_session'
        config: []
    gateway_paypal:
        gatewayName: 'PayPal'
        factoryName: 'paypal_express_checkout'
        config: []

Sylius\Component\Payment\Model\PaymentMethodTranslation:
    payment_method_cash_on_delivery_translation:
        name: 'Cash on delivery'
        locale: 'en_US'
        description: 'Pay on delivery'
        translatable: '@payment_method_cash_on_delivery'
    payment_method_stripe_translation:
        name: 'Credit Card (Stripe)'
        locale: 'en_US'
        description: 'Pay by credit card'
        translatable: '@payment_method_stripe'
    payment_method_paypal_translation:
        name: 'PayPal'
        locale: 'en_US'
        description: 'Pay via PayPal'
        translatable: '@payment_method_paypal'

Sylius\Component\Core\Model\PaymentMethod:
    payment_method_cash_on_delivery:
        code: 'CASH_ON_DELIVERY'
        enabled: true
        gatewayConfig: '@gateway_offline'
        currentLocale: 'en_US'
        translations: ['@payment_method_cash_on_delivery_translation']
        channels: ['@channel_web']
    payment_method_stripe:
        code: 'STRIPE'
        enabled: true
        gatewayConfig: '@gateway_stripe'
        currentLocale: 'en_US'
        translations: ['@payment_method_stripe_translation']
        channels: ['@channel_web']
    payment_method_paypal:
        code: 'PAYPAL'
        enabled: true
        gatewayConfig: '@gateway_paypal'
        currentLocale: 'en_US'
        translations: ['@payment_method_paypal_translation']
        channels: ['@channel_web']
