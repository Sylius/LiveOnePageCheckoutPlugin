sylius_live_one_page_checkout_shop_checkout:
    path: /checkout/one-page
    methods: [ GET, PUT ]
    defaults:
        _controller: sylius.controller.order::updateAction
        _sylius:
            event: complete
            flash: false
            template: "@SyliusLiveOnePageCheckoutPlugin/shop/checkout/one_page.html.twig"
            form:
                type: Sylius\LiveOnePageCheckoutPlugin\Form\Type\CheckoutType
                options:
                  customer: expr:service('sylius.context.customer').getCustomer()
            repository:
                method: findCartForSummary
                arguments:
                  - "expr:service('sylius.context.cart').getCart().getId()"
            state_machine:
                graph: sylius_order_checkout
                transition: complete
            redirect:
                route: sylius_shop_order_pay
                parameters:
                    tokenValue: resource.tokenValue